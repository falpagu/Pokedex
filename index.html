<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex</title>
    <link
      rel="icon"
      type="icon"
      sizes="32x32"
      href="./assets/icon_logos/pokemon_logo_2.svg"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body onload="init()">
    <header>
      <nav>
        <a
          class="navLogo"
          href="index.html"
          rel="noopener noreferrer"
        >
          <img
            src="./assets/icon_logos/pokemon_logo_1.svg"
            alt="pokemon logo"
          />

          <span>Pokedex</span>
        </a>
        <input  type="text" id="searchInput" placeholder="search Pokémon..." />
      </nav>
    </header>

    <main>

      <div id="spinner" class="spinner">
        <div class="spinnerText">Loading ...</div>
        <div class="spinner-sector spinner-sector-red"></div>
        <div class="spinner-sector spinner-sector-blue"></div>
        <div class="spinner-sector spinner-sector-green"></div>
      </div>

      <div class="pokeContainer" id="content"></div>
      
      <button id="moreBtn" onclick="loadPokemon()" class="morePoke"> more Pokémon ...</button>

      <dialog id="popUp"></dialog>
      
    </main>

    <footer>
      <div class="footerContainer">
        <a href="https://developerakademie.com/" target="_blank"
          ><img
            src="./assets/icon_logos/DevAkak-Logo.svg"
            alt="Developer Akademie Logo"
        /></a>
        <span>© 2026 Developer Akademie GmbH</span>
      </div>
    </footer>

    <script src="./scripts/template.js"></script>
    <script src="script.js"></script>
  </body>
</html>
